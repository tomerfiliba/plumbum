name: CI

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - main
  pull_request:

env:
  FORCE_COLOR: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}


jobs:

  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
    - name: pylint
      run: uvx nox -s pylint -- --output-format=github

  tests:
    name: Tests on 🐍 ${{ matrix.python-version }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
        - python-version: 'pypy-3.11'
          os: ubuntu-latest
        - python-version: '3.10'
          os: ubuntu-latest
        - python-version: '3.12'
          os: ubuntu-latest
        - python-version: '3.13'
          os: ubuntu-latest
        - python-version: '3.15'
          os: ubuntu-latest
        - python-version: '3.15'
          os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read  # to check out the repository

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup uv (cached)
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}
        cache-dependency-glob: "**/pyproject.toml"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Add locale for locale test
      if: runner.os == 'Linux' && matrix.python-version != '3.11'
      run: sudo locale-gen fr_FR.UTF-8

    - name: Install
      run: |
        uv venv --python "$PYTHON_VERSION"
        uv pip install -e.[test] pytest-github-actions-annotate-failures
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}

    - name: Setup SSH tests
      if: runner.os != 'Windows'
      run: |
        set -eux

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        cat <<'EOF' >> ~/.ssh/config
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
        NoHostAuthenticationForLocalhost yes
        EOF

        ssh-keygen -q -f ~/.ssh/id_rsa -N '' -t rsa -m PEM
        cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/authorized_keys

        ls -la ~
        ssh localhost -vvv "echo 'Worked!'"

    - name: Test with pytest
      run: uv run pytest --cov --run-optional-tests=ssh,sudo

    - name: Upload coverage
      run: uvx coveralls --service=github
      env:
        COVERALLS_PARALLEL: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: test-${{ matrix.os }}-${{ matrix.python-version }}

  coverage:
    name: Coverage
    needs: [tests]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
    - name: Install coveralls
      run: pipx install coveralls
    - name: Coveralls Finished
      run: coveralls --service=github --finish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
